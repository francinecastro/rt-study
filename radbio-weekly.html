const BANK=[{"q":"Which collection contains the three lethal chromosome configurations?","choices":["Dicentric, mutation, duplication","Ring, inversion, deletion","Translocation, inversion, chromatid break","Ring, dicentric, anaphase bridge"],"why":"The three lethal configurations are ring, dicentric and anaphase bridge.","key":3,"tags":["week8"],"id":"rb1"},{"q":"According to the TD 5/5 chart, what dose is listed for skin necrosis or ulceration?","choices":["50 Gy","60 Gy","55 Gy","40 Gy"],"why":"The TD 5/5 chart gives 55 Gy for skin necrosis or ulceration. This chart value is distinct from the separate 60 Gy skin reaction value.","key":2,"tags":["week10","td"],"id":"rb2corrected"},{"q":"What does LET describe?","choices":["Energy deposited per unit of track length","Probability of a late cancer per unit time","Dose needed under hypoxic conditions divided by aerobic dose","Energy deposited per unit mass"],"why":"LET is track energy deposition, commonly in keV per micrometer.","key":0,"tags":["week8"],"id":"rb3"},{"q":"Which unit measures absorbed dose?","choices":["Sievert","Roentgen","Gray","Rem"],"why":"Gray measures absorbed dose in energy per mass.","key":2,"tags":["review"],"id":"rb4"},{"q":"After radiation, the G2/M transition is delayed and mitosis temporarily decreases. What is this called?","choices":["Division delay","Chromosome translocation","Differentiation","Interphase death"],"why":"This describes a delay in G2/mitosis as division delay.","key":0,"tags":["week8"],"id":"rb5"},{"q":"Which detector is a type of thimble ionization chamber?","choices":["Geiger Müller counter","Thermoluminescent dosimeter","Neutron counter","Farmer chamber"],"why":"A thimble chamber is the Farmer chamber as a thimble chamber.","key":3,"tags":["review"],"id":"rb6"},{"q":"What is the daily tolerance for the optical distance indicator (ODI)?","choices":["1.5 mm","2 mm","3 mm","1 mm"],"why":"ODI daily tolerance is 2 mm.","key":1,"tags":["qa"],"id":"rb7"},{"q":"Which description best matches indirect ionization?","choices":["Radiation interacts with water and the resulting free radicals damage DNA","Radiation damages DNA directly without involving other molecules","Radiation causes an unchanged chromosome to duplicate","Radiation alters DNA through mitosis alone"],"why":"Indirect action involves indirect action with water radiolysis and free radicals.","key":0,"tags":["week8"],"id":"rb8"},{"q":"An abnormal chromosome contains two centromeres. Which term fits?","choices":["Inverted chromosome","Dicentric chromosome","Ring chromosome","Duplicated chromosome"],"why":"Di means two; a dicentric chromosome has two centromeres.","key":1,"tags":["week8"],"id":"rb9"},{"q":"An early or acute tissue effect is generally observed within which period?","choices":["Only after 12 months","After 6 months","Only after 5 years","Within 6 months"],"why":"Early tissue effects occur within 6 months.","key":3,"tags":["week9"],"id":"rb10"},{"q":"Which description best fits fixed postmitotic (FPM) cells?","choices":["Highly differentiated cells that do not divide","Undifferentiated cells that divide rapidly","Developing connective tissue cells that divide repeatedly","Moderately differentiated cells that regularly regenerate"],"why":"FPM cells are mature and typically do not divide.","key":0,"tags":["week9"],"id":"rb11"},{"q":"Which agency regulates the shipping of radioactive materials?","choices":["Nuclear Regulatory Commission","National Council on Radiation Protection and Measurements","Department of Transportation","Food and Drug Administration"],"why":"The Department of Transportation regulates transport of radioactive materials.","key":2,"tags":["review"],"id":"rb12"},{"q":"More dose increases the chance that an effect will occur, but does not necessarily increase its severity. Which category fits?","choices":["Early responding tissue only","Stochastic","Deterministic","Regeneration"],"why":"Stochastic dose relationships concern incidence or probability.","key":1,"tags":["week10"],"id":"rb13"},{"q":"Which DNA injury is generally harder for a cell to repair?","choices":["Loss of a single hydrogen bond","Temporary mitotic delay","Single strand break","Double strand break"],"why":"Double strand breaks damage both DNA strands and are harder to restore correctly.","key":3,"tags":["week8"],"id":"rb14"},{"q":"Which description fits reverting postmitotic (RPM) cells?","choices":["Are always less mature than VIM cells","Usually do not divide but can return to division","Never divide again under any condition","Divide continuously throughout life"],"why":"RPM cells normally do not divide, but retain the ability to do so.","key":1,"tags":["week9"],"id":"rb15"},{"q":"Which pair correctly matches the TD 5/5 values?","choices":["Lung 17.5 Gy; kidney 32 Gy","Lung 30 Gy; kidney 23 Gy","Lung 17.5 Gy; kidney 23 Gy","Lung 23 Gy; kidney 17.5 Gy"],"why":"The values are lung 17.5 Gy and kidney 23 Gy.","key":2,"tags":["td"],"id":"rb16"},{"q":"Which feature helps identify the deterministic graph?","choices":["A horizontal risk line across all doses","A curve that decreases with dose","An initial no effect region before the response rises","A straight line rising from zero with no threshold"],"why":"The deterministic illustration has a threshold below which tissue reaction does not appear.","key":2,"tags":["week10"],"id":"rb17"},{"q":"What is the daily collimator field size tolerance?","choices":["3 mm","1 mm","1.5 mm","2 mm"],"why":"The daily collimator field size tolerance is 2 mm.","key":3,"tags":["qa"],"id":"rb18"},{"q":"A LINAC daily output check reads 1.40 compared with a normalized baseline of 1.00. What is the correct response?","choices":["Treat and do not notify physics","Treat and notify physics later","Do not treat but do not notify physics","Do not treat and notify physics"],"why":"The 40% departure is far beyond the 3% daily output tolerance used in this set.","key":3,"tags":["qa"],"id":"rb19"},{"q":"Which phase of the cell cycle is most radiosensitive?","choices":["Mitosis","G1","G0","S phase"],"why":"lists mitosis as most radiosensitive.","key":0,"tags":["week8"],"id":"rb20"},{"q":"Which description identifies oxygen enhancement ratio (OER)?","choices":["Aerobic dose divided by hypoxic dose for the same effect","Absorbed dose divided by equivalent dose","High LET dose divided by low LET dose for the same effect","Hypoxic dose divided by aerobic dose for the same biological effect"],"why":"OER compares the dose needed without enough oxygen with the dose needed in oxygenated conditions.","key":3,"tags":["week8"],"id":"rb21"},{"q":"What is the TD 5/5 dose for the brainstem?","choices":["50 Gy","45 Gy","47 Gy","52 Gy"],"why":"The new brainstem entry is 50 Gy, with necrosis/infarction.","key":0,"tags":["td"],"id":"rb22"},{"q":"Which chromosome change involves a missing segment of genetic material?","choices":["Deletion","Duplication","Translocation","Inversion"],"why":"Deletion is the loss of chromosome material.","key":0,"tags":["week8"],"id":"rb23"},{"q":"What dose range is associated for wet desquamation?","choices":["20–30 Gy","10–23 Gy","40–50 Gy","55–65 Gy"],"why":"The wet desquamation range used in this practice set is 40 to 50 Gy.","key":2,"tags":["week10"],"id":"rb24"},{"q":"What is the annual occupational extremity dose equivalent limit?","choices":["0.5 rem","1 rem","5 rem","50 rem"],"why":"and Week 9 quiz both test 50 rem for occupational extremities.","key":3,"tags":["review"],"id":"rb25"},{"q":"A radiation effect becomes more severe as absorbed dose increases above its threshold. Which effect category best fits?","choices":["Genetic only","Deterministic","Stochastic","Indirect action only"],"why":"For deterministic injury, increasing dose can increase severity after the threshold is exceeded.","key":1,"tags":["week10"],"id":"rb26"},{"q":"Which detector is used to survey background radiation in a room?","choices":["Thermoluminescent dosimeter","Geiger Müller detector","Farmer chamber","Film badge"],"why":"specifies a Geiger Müller detector.","key":1,"tags":["review"],"id":"rb27"},{"q":"Which organ is listed at 65 Gy?","choices":["Bladder","Femoral head","Skin","Rectum"],"why":"The chart places the bladder at 65 Gy.","key":0,"tags":["td"],"id":"rb28"},{"q":"Which pair has the same 40 Gy value?","choices":["Brain and spinal cord","Heart and small intestine","Parotid and liver","Stomach and esophagus"],"why":"Both heart and small intestine are 40 Gy in this chart.","key":1,"tags":["td"],"id":"rb29"},{"q":"Which warning label belongs on a container transporting or storing radionuclides?","choices":["Caution: radioactive material","Caution: x ray room","Caution: high radiation area","Danger: high radiation area"],"why":"distinguishes radioactive material containers from high radiation areas.","key":0,"tags":["review"],"id":"rb30"},{"q":"A therapist checks only a patient’s date of birth against the wristband. Is that enough to identify the patient?","choices":["Yes, if the wristband is printed","Yes, date of birth alone is sufficient","No, two independent identifiers are needed","Yes, if the patient recognizes the therapist"],"why":"requires two patient identifiers.","key":2,"tags":["review"],"id":"rb31"},{"q":"Which answer best describes somatic versus germ cell damage?","choices":["Neither can cause genetic changes","Somatic affects the exposed individual; germ cell damage may affect future generations","Somatic damage affects only descendants; germ cell damage never does","Both always cause hereditary effects"],"why":"Only germ cell changes can be transmitted to offspring.","key":1,"tags":["week8"],"id":"rb32"},{"q":"A piece of one chromosome breaks off and attaches to another chromosome. What change is this?","choices":["Deletion","Inversion","Translocation","Duplication"],"why":"Translocation moves a segment to another chromosome.","key":2,"tags":["week8"],"id":"rb33"},{"q":"Which effect is deterministic?","choices":["Radiation induced thyroid cancer","Cataract formation","Hereditary cancer risk","Radiation induced breast cancer"],"why":"lists cataracts among deterministic tissue reactions.","key":1,"tags":["week10"],"id":"rb34"},{"q":"What is the TD 5/5 dose for the optic chiasm?","choices":["50 Gy","47 Gy","55 Gy","45 Gy"],"why":"The optic chiasm is a new 50 Gy entry with blindness as the listed complication.","key":0,"tags":["td"],"id":"rb35"},{"q":"What is the monthly output QA tolerance?","choices":["2%","1%","5%","3%"],"why":"Monthly output tolerance is 2% .","key":0,"tags":["qa"],"id":"rb36"},{"q":"Which statement correctly compares IMRT and non IMRT laser tolerances?","choices":["IMRT 2 mm; non IMRT 2 mm","IMRT 1 mm; non IMRT 1.5 mm","IMRT 1.5 mm; non IMRT 2 mm","IMRT 2 mm; non IMRT 1.5 mm"],"why":"The listed value is 1.5 mm and 2 mm respectively.","key":2,"tags":["qa"],"id":"rb37"},{"q":"Which organ is listed at 52 Gy?","choices":["Stomach","Brainstem","Skin","Femoral head"],"why":"The femoral head is 52 Gy, with necrosis.","key":3,"tags":["td"],"id":"rb38"},{"q":"Which event is a base sequence change rather than a change in chromosome number?","choices":["Mutation","Division delay","Regeneration","Mitotic overshoot"],"why":"The defines a base sequence change as a mutation.","key":0,"tags":["week8"],"id":"rb39"},{"q":"Which tissue reaction in a head and neck patient is deterministic?","choices":["Hereditary mutation in descendants","Radiation induced osteosarcoma","Secondary leukemia","Xerostomia"],"why":"Dry mouth is listed as a deterministic tissue reaction.","key":3,"tags":["week10"],"id":"rb40"},{"q":"Which group contains late responding tissues?","choices":["Germ cells, intestinal epithelium, lymphocytes","Skin, intestinal lining, bone marrow","Intestinal lining, testes, bone marrow","Muscle, liver, central nervous system"],"why":"group muscle, liver and CNS as late responding.","key":3,"tags":["week9"],"id":"rb41"},{"q":"Which description most closely fits reproductive failure after irradiation?","choices":["A cell loses its ability to continue repeated divisions","A cell briefly pauses in G2 and resumes normal division","A cell replaces injured tissue with the same cell type","A cell immediately increases its mitotic index"],"why":"Reproductive or mitotic death is the loss of reproductive integrity.","key":0,"tags":["week8"],"id":"rb42"},{"q":"Which cells are generally most radioresistant?","choices":["Well differentiated and rarely dividing","Undifferentiated and rapidly dividing","Stem cells with a long mitotic future","Bone marrow precursors with active mitosis"],"why":"Mature specialized cells usually divide less often.","key":0,"tags":["week9"],"id":"rb43"},{"q":"Which outcome is most characteristic of a late tissue response?","choices":["Short lived edema followed by full regeneration","A transient increase in mitotic index","Fibrosis and lasting tissue changes","Immediate free radical formation only"],"why":"The relationship links late injury with fibrosis, atrophy, ulceration, and limited reversibility.","key":2,"tags":["week9"],"id":"rb44"},{"q":"What is the daily IMRT MLC leaf speed and position tolerance?","choices":["2 mm","3 mm","1 mm","1.5 mm"],"why":"The listed value is 1 mm for IMRT MLC speed and position.","key":2,"tags":["qa"],"id":"rb45"},{"q":"Which statement describes the linear no threshold (LNT) model?","choices":["It assumes zero risk until a fixed threshold then a sudden rise","It assumes risk falls as dose increases","It assumes only tissue reactions are possible","It assumes risk at every nonzero dose and a linear relationship with dose"],"why":"says radiation protection uses LNT, which assumes risk at all doses.","key":3,"tags":["week10"],"id":"rb46"},{"q":"Which tolerance appears for annual MLC transmission?","choices":["5%","3%","2%","1%"],"why":"Annual MLC transmission is 2% .","key":2,"tags":["qa"],"id":"rb47"},{"q":"Which complication is paired with the optic chiasm?","choices":["Pericarditis","Blindness","Myelitis","Perforation/stricture"],"why":"The optic chiasm chart entry identifies blindness.","key":1,"tags":["td"],"id":"rb48"},{"q":"Which dose response model is used for radiation protection?","choices":["Linear quadratic no threshold","Linear no threshold","Threshold sigmoid only","A plateau with zero slope"],"why":"Radiation protection uses LNT .","key":1,"tags":["week10"],"id":"rb49"},{"q":"What daily waveguide pressure range is listed?","choices":["32–40 PSI","25–32 PSI","20–25 PSI","45–50 PSI"],"why":"The course chart specifies 25–32 PSI.","key":1,"tags":["qa"],"id":"rb50"},{"q":"Which pair correctly describes tissue healing?","choices":["Neither uses replacement cells","Both always use the same cell type","Regeneration uses the same cell type; repair uses a different cell type","Regeneration uses a different cell type; repair uses the same cell type"],"why":"The course distinguishes regeneration and repair by the type of replacement cell.","key":2,"tags":["week9"],"id":"rb51"},{"q":"Which type of imaging does not use ionizing radiation?","choices":["CT","Radiography","MRI","Nuclear medicine"],"why":"MRI uses a magnetic field and radiofrequency pulses, not ionizing radiation.","key":2,"tags":["review"],"id":"rb52"},{"q":"Which set contains only stochastic radiation effects?","choices":["Skin injury, radiation syndrome, lung cancer","Cataracts, alopecia, sterility","Erythema, xerostomia, leukemia","Skin cancer, osteosarcoma, thyroid cancer"],"why":"Skin, bone and thyroid cancers are listed as stochastic.","key":3,"tags":["week10"],"id":"rb53"},{"q":"What is the daily gantry rotation QA tolerance?","choices":["1°","0.5°","1.5°","2°"],"why":"The daily gantry tolerance is 1°.","key":0,"tags":["qa"],"id":"rb54"},{"q":"Which cell category is the most radiosensitive in the classification system?","choices":["RPM","DIM","FPM","VIM"],"why":"Vegetative intermitotic cells divide rapidly and are least mature among these groups.","key":3,"tags":["week9"],"id":"rb55"},{"q":"What is the daily imaging and treatment coordinate coincidence tolerance for non SRS/SBRT?","choices":["1 mm","2 mm","3 mm","1.5 mm"],"why":"The values are 2 mm for non SRS/SBRT.","key":1,"tags":["qa"],"id":"rb56"},{"q":"Which set contains only deterministic radiation effects?","choices":["Leukemia, hereditary effects, cataracts","Breast cancer, skin cancer, xerostomia","Lung cancer, erythema, thyroid cancer","Alopecia, sterility, skin injury"],"why":"Hair loss, sterility, and skin injury are listed as deterministic.","key":3,"tags":["week10"],"id":"rb57"},{"q":"Which statement correctly distinguishes deterministic from stochastic radiation effects?","choices":["Both have thresholds and increasing severity","Deterministic has a threshold and increasing severity; stochastic has no assumed threshold and increasing incidence","Neither has a threshold and neither depends on dose","Deterministic has no threshold and increasing incidence; stochastic has a threshold and increasing severity"],"why":"Severity is central to deterministic reactions; probability is central to stochastic risk.","key":1,"tags":["week10"],"id":"rb58"},{"q":"What dose range is associated for erythema?","choices":["20–30 Gy","10–17.5 Gy","40–50 Gy","55–60 Gy"],"why":"The skin erythema range used in this practice set is 20 to 30 Gy.","key":0,"tags":["week10"],"id":"rb59"},{"q":"What is the daily imaging and treatment coordinate coincidence tolerance for SRS/SBRT?","choices":["2 mm","1 mm","1.5 mm","3 mm"],"why":"The values are 1 mm for SRS/SBRT.","key":1,"tags":["qa"],"id":"rb60"},{"q":"Which collection contains the three features of highly radiosensitive cells described by Bergonié and Tribondeau?","choices":["Rarely dividing, undifferentiated, short mitotic future","Rarely dividing, specialized, long mitotic future","Actively dividing, undifferentiated, long mitotic future","Actively dividing, well differentiated, short mitotic future"],"why":"Rapid division, low differentiation, and many future divisions increase radiosensitivity.","key":2,"tags":["week9"],"id":"rb61"},{"q":"What is the TD 5/5 dose for the esophagus?","choices":["60 Gy","55 Gy","52 Gy","50 Gy"],"why":"The new esophagus entry is 55 Gy, with perforation/stricture.","key":1,"tags":["td"],"id":"rb62"},{"q":"Radiation causes a cell to die before entering mitosis. Which fate is described?","choices":["Mitotic overshoot","Interphase death","Mitotic delay","Reproductive failure after division"],"why":"Interphase death occurs before mitosis.","key":1,"tags":["week8"],"id":"rb63"},{"q":"A dose rate is 4 mR/hr at 8 meters. What is it at 4 meters?","choices":["8 mR/hr","32 mR/hr","16 mR/hr","2 mR/hr"],"why":"Half the distance gives four times the intensity by the inverse square law: 4 × (8/4)² = 16.","key":2,"tags":["review"],"id":"rb64"},{"q":"Which structure has 47 Gy?","choices":["Brain","Spinal cord","Brainstem","Optic chiasm"],"why":"The spinal cord is 47 Gy, with myelitis/necrosis.","key":1,"tags":["td"],"id":"rb65"},{"q":"Which combination correctly matches LET and oxygen dependence?","choices":["High LET, more oxygen dependence, OER near 3","Low LET, more oxygen dependence, OER near 3","High LET, more oxygen dependence, OER near 0","Low LET, less oxygen dependence, OER near 1"],"why":"The relationship links low LET with greater oxygen dependence and an OER around 3.","key":1,"tags":["week8"],"id":"rb66"},{"q":"How do pressure and LINAC output change relative to each other?","choices":["Output stays unchanged","Opposite directions","Relationship is unrelated to pressure","Same direction"],"why":"Pressure and output change in the same direction.","key":3,"tags":["qa"],"id":"rb67"},{"q":"How do temperature and LINAC output change relative to each other?","choices":["Opposite directions","Both increase only when pressure decreases","Output does not change with temperature","Same direction"],"why":"Temperature and output change in opposite directions.","key":0,"tags":["qa"],"id":"rb68"},{"q":"Which statement about stochastic effects is consistent with the protection model?","choices":["A low dose can contribute to modeled risk even without a known threshold","Once cancer occurs, the dose predicts how severe it will be","Below a threshold stochastic effects cannot occur","A low dose guarantees cancer later"],"why":"LNT conservatively models nonzero risk at any nonzero dose; it does not guarantee an effect.","key":0,"tags":["week10"],"id":"rb69"},{"q":"Which change generally reduces the oxygen enhancement ratio as radiation LET rises?","choices":["The biological effect becomes more dependent on oxygen","The biological effect becomes less dependent on oxygen","The radiation stops depositing energy","The amount of water in the cell becomes zero"],"why":"High LET radiation is less dependent on oxygen to cause damage.","key":1,"tags":["week8"],"id":"rb70"},{"q":"Which dose response model is preferred by radiation biologists?","choices":["A constant response regardless of dose","Threshold only with no increase after threshold","Linear quadratic without threshold","Linear no threshold only"],"why":"The linear quadratic model describes greater biological response at higher doses.","key":2,"tags":["week10"],"id":"rb71"},{"q":"Which gas is used to prevent electrical arcing in the LINAC waveguide?","choices":["Carbon dioxide","Sulfur hexafluoride","Nitrogen","Helium"],"why":"The gas is sulfur hexafluoride.","key":1,"tags":["qa"],"id":"rb72"},{"q":"What is the daily tolerance for SRS lasers?","choices":["1 mm","2.5 mm","2 mm","1.5 mm"],"why":"SRS laser tolerance is 1 mm.","key":0,"tags":["qa"],"id":"rb73"},{"q":"A tumor needs 450 cGy under hypoxic conditions and 150 cGy under aerobic conditions for the same effect. What is its OER?","choices":["3.0","1.5","0.33","300"],"why":"450 ÷ 150 = 3.0.","key":0,"tags":["week8"],"id":"rb74"},{"q":"In the separate skin reaction values supplied for practice, which dose is associated with skin death or necrosis?","choices":["55 Gy","60 Gy","20–30 Gy","40–50 Gy"],"why":"The supplied skin reaction list gives 60 Gy for skin death or necrosis. The TD 5/5 chart separately gives 55 Gy for skin necrosis or ulceration.","key":1,"tags":["week10"],"id":"rb75corrected"},{"q":"Which pair gives the approximate proportions of direct and indirect radiation action?","choices":["Direct about 30%; indirect about 70%","Direct about 90%; indirect about 10%","Direct about 70%; indirect about 30%","Direct about 50%; indirect about 50%"],"why":"The course materials describe roughly 30% direct and 70% indirect radiation action.","key":0,"tags":["week8"],"id":"rb76"},{"q":"An unrepaired DNA break occurs before the DNA is replicated in S phase. Which type of aberration can result?","choices":["Somatic regeneration","Chromatid aberration after G2","Mitotic overshoot","Chromosome aberration"],"why":"pre-replication injury with chromosome aberrations.","key":3,"tags":["week8"],"id":"rb77"},{"q":"Which effect is classified as stochastic?","choices":["Alopecia","Erythema","Radiation induced leukemia","Xerostomia"],"why":"Cancer and leukemia are stochastic effects .","key":2,"tags":["week10"],"id":"rb78"},{"q":"Which group is listed as early responding tissue?","choices":["Liver, muscle, central nervous system","Intestinal lining, testes, bone marrow","Liver, brainstem, mature nerve cells","Brain, spinal cord, mature muscle"],"why":"The intestinal lining, testes, and bone marrow are early responding tissues.","key":1,"tags":["week9"],"id":"rb79"},{"q":"Which pair measures equivalent dose?","choices":["Roentgen and coulomb/kg","Sievert and rem","Gray and sievert","Gray and rad"],"why":"Sievert and rem are units of equivalent dose.","key":1,"tags":["review"],"id":"rb80"},{"q":"Which cell type is extremely radiosensitive?","choices":["Lymphocyte","Mature muscle cell","Mature nerve cell","Mature red blood cell"],"why":"Lymphocytes are exceptionally radiosensitive.","key":0,"tags":["week9"],"id":"rb81"},{"q":"What is the annual occupational whole body dose limit?","choices":["5 rem","1 rem","0.5 rem","50 rem"],"why":"The occupational annual whole body effective dose limit listed is 5 rem.","key":0,"tags":["review"],"id":"rb82"},{"q":"A daily output check reads 0.98 relative to a baseline of 1.00. What is the correct response?","choices":["Out of tolerance; treat and notify physics","Within tolerance; continue treating","Out of tolerance; stop and notify physics","Within tolerance; stop and recalibrate"],"why":"A value of 0.98 is 2% below baseline and within the 3% daily output tolerance.","key":1,"tags":["qa"],"id":"rb83"},{"q":"Which interaction involves an inner shell electron?","choices":["Photoelectric effect","Coherent scatter","Pair production","Compton scatter"],"why":"The photoelectric effect ejects a tightly bound inner shell electron.","key":0,"tags":["review"],"id":"rb84"},{"q":"Which organ is paired with 32 Gy?","choices":["Kidney","Parotid","Brain","Liver"],"why":"The parotid gland is listed at 32 Gy, with xerostomia as the complication.","key":1,"tags":["td"],"id":"rb85"},{"q":"A broken chromosome segment is reversed and reinserted into the same chromosome. What change is this?","choices":["Deletion","Duplication","Translocation","Inversion"],"why":"Inversion reverses the order of a chromosome segment.","key":3,"tags":["week8"],"id":"rb86"}];
const SETS={week8:['Week 8','OER, DNA Damage, LET and RBE'],week9:['Week 9','Radiosensitivity and Tissue Effects'],week10:['Week 10','Deterministic and Stochastic Effects'],qa:['QA Practice','LINAC Safety and Tolerances'],td:['TD 5/5','Organ Tolerance Doses'],review:['Mixed Course Review','Radiation Fundamentals'],all:['Full Mixed Exam','All Radiation Biology Topics']};
const $=id=>document.getElementById(id);let current='week8',order=[],answers={},position=0,reviewMode=false;
const key=id=>'fran-radbio-quiz-v3-'+id;
function safeRead(id){try{return JSON.parse(localStorage.getItem(key(id)))}catch(e){return null}}
function save(){try{if(!reviewMode)localStorage.setItem(key(current),JSON.stringify({answers,position}))}catch(e){}}
function start(id,onlyMissed=null){current=id;reviewMode=!!onlyMissed;order=onlyMissed||((id==='all')?BANK:BANK.filter(q=>q.tags.includes(id)));let saved=reviewMode?null:safeRead(id);answers=saved?.answers||{};position=reviewMode?0:Math.max(0,Math.min(order.length-1,saved?.position||0));$('subtitle').textContent=SETS[id][0]+' · '+SETS[id][1];$('weekPicker').value=id;$('quizCard').style.display='block';$('results').style.display='none';render();}
function render(){if(position>=order.length){finish();return}const q=order[position],a=answers[q.id],locked=!!a?.submitted;$('num').textContent='Question '+(position+1)+' of '+order.length;const done=order.filter(x=>answers[x.id]?.submitted).length;$('barInner').style.width=(done/order.length*100)+'%';$('pct').textContent=Math.round(done/order.length*100)+'% Complete';$('promptText').textContent=q.q;const box=$('choices');box.replaceChildren();q.choices.forEach((c,j)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(a?.selected===j?' chosen':'')+(locked&&j===q.key?' correct':'')+(locked&&a?.selected===j&&j!==q.key?' wrong':'');b.disabled=locked;const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[j];const label=document.createElement('span');label.textContent=c;b.append(letter,label);b.onclick=()=>{answers[q.id]={selected:j,submitted:false};save();render()};box.append(b)});const f=$('feedback');f.style.display=locked?'block':'none';if(locked){const ok=a.selected===q.key;f.className='feedback '+(ok?'good':'bad');f.replaceChildren();const top=document.createElement('strong');top.textContent=ok?'Correct!':'Not quite. Correct answer: '+ 'ABCD'[q.key]+'. '+q.choices[q.key];const exp=document.createElement('span');exp.textContent=q.why;f.append(top,exp)}$('submit').disabled=locked||a?.selected===undefined;$('submit').textContent=locked?'Answer Submitted':'Submit Answer';$('prev').disabled=position===0;$('next').textContent=position===order.length-1?'See Results ›':'Next ›';$('next').disabled=!locked;}
$('submit').onclick=()=>{const q=order[position];if(answers[q.id]?.selected===undefined)return;answers[q.id].submitted=true;save();render();};
$('prev').onclick=()=>{if(position>0){position--;save();render()}};
$('next').onclick=()=>{if(!answers[order[position].id]?.submitted)return;position++;save();render();};
function finish(){const correct=order.filter(q=>answers[q.id]?.submitted&&answers[q.id].selected===q.key).length;const bad=order.filter(q=>!answers[q.id]?.submitted||answers[q.id].selected!==q.key);$('quizCard').style.display='none';$('results').style.display='block';$('num').textContent='Quiz complete';$('pct').textContent='100% Complete';$('barInner').style.width='100%';$('score').textContent=correct+' / '+order.length+' · '+Math.round(correct/order.length*100)+'%';$('summary').textContent=bad.length?bad.length+' missed or unanswered questions. Review each one below.':'Perfect score. You got every question correct.';const missed=$('missed');missed.replaceChildren();if(!bad.length){const div=document.createElement('div');div.className='empty';div.textContent='No missed questions.';missed.append(div)}bad.forEach(q=>{let a=answers[q.id];const d=document.createElement('div');d.className='review';const title=document.createElement('strong');title.textContent=q.q;d.append(title);for(const s of ['Your answer: '+(a?.submitted?q.choices[a.selected]:'Not submitted'),'Correct answer: '+q.choices[q.key],q.why]){const p=document.createElement('p');p.textContent=s;d.append(p)}missed.append(d)});$('retry').disabled=!bad.length;$('retry').onclick=()=>{answers={};start(current,bad)};$('restart').onclick=()=>{if(!reviewMode){try{localStorage.removeItem(key(current))}catch(e){}}answers={};start(current,reviewMode?order:null)};$('print').onclick=()=>window.print();window.scrollTo({top:0,behavior:'smooth'})}
$('weekPicker').onchange=e=>start(e.target.value);const chosen=new URLSearchParams(location.search).get('week');start(SETS[chosen]?chosen:'week8');
</script></body></html>
